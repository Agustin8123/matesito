<!DOCTYPE html>
<html lang="es-AR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi cuenta · Matesito</title>
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" href="/resources/PNG/favicon.png">
    <link rel="stylesheet" href="/index.css">
    <link rel="stylesheet" href="/modern.css">
    <link rel="stylesheet" href="/feedback.css">
    <link rel="stylesheet" href="/account.css">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/feedback.js"></script>
</head>
<body class="account-page">
    <header class="header"><a href="/">← Volver a la ronda</a><button class="theme-toggle" onclick="toggleTheme()"><span class="nav-text">Modo claro</span></button></header>
    <main class="container" id="appContainer" style="display:none">
        <div class="page-intro"><h1>Tu cuenta, a tu manera.</h1><p>Actualizá cómo te ve la comunidad.</p></div>
        <section class="settings-item">
            <h2>Foto de perfil</h2>
            <input type="file" id="profileImage" accept="image/*" hidden>
            <button type="button" id="userButton" onclick="document.getElementById('profileImage').click()" aria-label="Elegir foto de perfil"><img src="/res/default-avatar.svg" class="profile-pic-img" alt="Tu avatar"></button>
            <button type="button" onclick="updateProfileImage()">Guardar foto</button>
            <p class="field-hint">Una imagen de hasta 10 MB.</p>
        </section>
        <section class="settings-item">
            <h2><label for="newUsername">Nombre de usuario</label></h2>
            <input id="newUsername" placeholder="Tu nuevo nombre" maxlength="25" autocomplete="username">
            <button type="button" onclick="updateUsername()">Guardar nombre</button>
        </section>
        <section class="settings-item">
            <h2><label for="userDescription">Sobre vos</label></h2>
            <textarea id="userDescription" placeholder="Contale un poco de vos a la ronda" rows="4" maxlength="1000"></textarea>
            <button type="button" onclick="updateDescription()">Guardar descripción</button>
        </section>
        <section class="settings-item">
            <h2>Contraseña</h2>
            <label for="currentPassword">Contraseña actual</label>
            <input type="password" id="currentPassword" autocomplete="current-password">
            <label for="newPassword">Nueva contraseña</label>
            <input type="password" id="newPassword" autocomplete="new-password" maxlength="128">
            <button type="button" id="togglePasswordButton" onclick="togglePassword(); togglePassword1()" aria-label="Mostrar u ocultar contraseñas"><img src="/resources/PNG/eyeClose.png" alt="Mostrar contraseñas"></button>
            <button type="button" onclick="updatePassword()">Cambiar contraseña</button>
        </section>
    </main>
    <div class="overlay" id="AvisoOverlay">
        <div class="initial-box"><h2>Iniciá sesión para ver tu cuenta.</h2><p>Conectate para editar tu perfil y tus preferencias.</p><button onclick="Acept1()">Ingresar</button> <a href="/">Volver al inicio</a></div>
    </div>
    <div class="overlay" id="usernameOverlay" style="display:none">
        <div class="username-box">
            <h2>Qué bueno verte de nuevo.</h2>
            <input id="usernameInput" aria-label="Nombre de usuario" placeholder="Nombre de usuario" autocomplete="username">
            <input type="password" id="passwordInput1" aria-label="Contraseña" placeholder="Contraseña" autocomplete="current-password">
            <button id="toggleBotonPassword" onclick="togglePassword2()" aria-label="Mostrar u ocultar contraseña"><img src="/resources/PNG/eyeClose.png" alt="Mostrar contraseña"></button>
            <div id="turnstileLogin"></div>
            <button onclick="loginUser()">Ingresar</button> <a href="/">Volver al inicio</a>
        </div>
    </div>
    <script src="/utils.js"></script>
    <script src="/scripts%20c.js"></script>
    <script src="/theme.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</body>
</html>
