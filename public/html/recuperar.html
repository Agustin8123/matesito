<!DOCTYPE html><html lang="es-AR" data-theme="dark"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,follow">
<title>Recuperar contraseña · Matesito</title><link rel="icon" href="/resources/PNG/favicon.png">
<link rel="stylesheet" href="/index.css"><link rel="stylesheet" href="/modern.css"><link rel="stylesheet" href="/panels.css"><link rel="stylesheet" href="/pages.css"><link rel="stylesheet" href="/feedback.css">
<script src="/feedback.js" defer></script><script src="/recovery.js" defer></script><link rel="stylesheet" href="/recovery.css?v=2"></head>
<body class="document-page"><!-- shared-sidebar --><button class="nav-backdrop" onclick="closeSidebar()" aria-label="Cerrar navegación" hidden></button><header class="header"><button class="mobile-menu icon-button" onclick="toggleSidebar()" aria-expanded="false" aria-controls="sidebar" aria-label="Abrir navegación"><img src="/res/hamburguesa-con-queso-amigo.svg" alt=""></button><a href="/">Volver a la ronda</a></header>
<main class="document-main recovery-page"><section class="settings-item recovery-card"><div class="recovery-heading"><span class="recovery-emblem" aria-hidden="true"><img src="/res/default-avatar.svg" alt=""></span><div><span class="recovery-eyebrow">RECUPERAR EL ACCESO</span><h1>Volvé a tu cuenta.</h1></div></div><p class="recovery-intro">Unos pasos y volvés a la ronda. Necesitás las tres respuestas que guardaste en tu cuenta.</p><ol class="recovery-steps" aria-label="Pasos de recuperación"><li id="recoveryStep1" aria-current="step"><span>1</span> Tu usuario</li><li id="recoveryStep2"><span>2</span> Tus respuestas</li></ol>
<form id="recoveryStart"><div class="recovery-field"><label for="recoveryUsername">Nombre de usuario</label><input id="recoveryUsername" placeholder="¿Cómo te llamás en Matesito?" autocomplete="username" required maxlength="25"></div><button class="recovery-primary">Continuar</button></form>
<form id="recoveryReset" hidden><div class="recovery-note">Respondé las tres preguntas. No distinguimos mayúsculas ni acentos.</div><div id="recoveryQuestions"></div><div class="recovery-passwords"><div class="recovery-field"><label for="resetPassword">Nueva contraseña</label><input type="password" id="resetPassword" placeholder="Al menos 8 caracteres" autocomplete="new-password" minlength="8" maxlength="128" required></div><div class="recovery-field"><label for="resetConfirm">Repetí la contraseña</label><input type="password" id="resetConfirm" placeholder="Una vez más" autocomplete="new-password" minlength="8" maxlength="128" required></div></div><button class="recovery-primary">Cambiar contraseña</button><button type="button" class="recovery-secondary" id="recoveryRestart">Usar otra cuenta</button></form>
<p role="status" id="recoveryResult" class="recovery-status"></p><a class="recovery-back" href="/">← Volver a iniciar sesión</a></section></main><script src="/theme.js"></script><script src="/site-shell.js"></script></body></html>
